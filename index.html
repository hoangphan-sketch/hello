<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lời Chúc May Mắn ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-pale: #fdf3d0;
      --red: #c0392b;
      --red-deep: #7b1a12;
      --ink: #1a0f00;
      --paper: #fdf6e3;
      --shadow: rgba(100, 40, 0, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--red-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
      position: relative;
    }

    /* Lantern decorations */
    .lantern {
      position: fixed;
      width: 36px;
      height: 50px;
      background: radial-gradient(ellipse at 40% 35%, #ffdd55 0%, #e8850a 60%, #c0390b 100%);
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      box-shadow: 0 0 24px 8px rgba(255,180,0,0.35), inset 0 0 16px rgba(255,255,200,0.4);
      animation: sway 3s ease-in-out infinite;
    }
    .lantern::before {
      content: '';
      position: absolute;
      top: -10px; left: 50%; transform: translateX(-50%);
      width: 6px; height: 12px;
      background: var(--gold);
      border-radius: 3px 3px 0 0;
    }
    .lantern::after {
      content: '';
      position: absolute;
      bottom: -14px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 16px;
      background: var(--gold-light);
      border-radius: 2px;
    }
    .lantern:nth-child(1) { top: 5%; left: 6%; animation-delay: 0s; }
    .lantern:nth-child(2) { top: 5%; right: 6%; animation-delay: 0.6s; }
    .lantern:nth-child(3) { top: 18%; left: 2%; animation-delay: 1.2s; transform: scale(0.75); }
    .lantern:nth-child(4) { top: 18%; right: 2%; animation-delay: 0.3s; transform: scale(0.75); }

    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    /* Falling petals */
    .petal {
      position: fixed;
      width: 10px; height: 14px;
      background: radial-gradient(ellipse, #ffcdd2, #e57373);
      border-radius: 50% 50% 50% 0;
      opacity: 0;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { opacity: 0; transform: translateY(-30px) rotate(0deg); }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(110vh) rotate(360deg); }
    }

    /* Main card */
    .card-wrap {
      position: relative;
      z-index: 10;
      perspective: 800px;
    }

    .card {
      width: min(88vw, 400px);
      background: var(--paper);
      border-radius: 4px;
      padding: 42px 36px 36px;
      box-shadow:
        0 0 0 6px var(--gold),
        0 0 0 10px var(--red),
        0 12px 50px rgba(0,0,0,0.55),
        inset 0 0 40px rgba(201,168,76,0.08);
      text-align: center;
      position: relative;
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      border: 1px solid var(--gold-light);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.82) translateY(30px) rotateX(10deg); }
      to { opacity: 1; transform: scale(1) translateY(0) rotateX(0deg); }
    }

    /* Corner ornaments */
    .card::before, .card::after {
      content: '❧';
      position: absolute;
      font-size: 22px;
      color: var(--gold);
      line-height: 1;
    }
    .card::before { top: 10px; left: 14px; }
    .card::after { bottom: 10px; right: 14px; transform: rotate(180deg); }

    .corner-tl, .corner-br {
      position: absolute;
      width: 28px; height: 28px;
      border-color: var(--gold);
      border-style: solid;
    }
    .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .title-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .title-line:last-child {
      background: linear-gradient(to left, transparent, var(--gold));
    }

    .title {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 400;
    }

    .symbol {
      font-size: 52px;
      margin: 10px 0 6px;
      display: block;
      animation: floatSymbol 3s ease-in-out infinite;
      filter: drop-shadow(0 3px 8px rgba(201,168,76,0.4));
    }
    @keyframes floatSymbol {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .heading {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 12px auto;
    }

    .fortune-text {
      font-size: 18px;
      font-style: italic;
      color: var(--red-deep);
      line-height: 1.65;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-weight: 400;
      letter-spacing: 0.2px;
      transition: opacity 0.35s ease;
    }

    .fortune-text.fade { opacity: 0; }

    .sub-text {
      font-size: 12px;
      color: #a07830;
      letter-spacing: 2px;
      margin-top: 14px;
      font-family: 'Noto Serif SC', serif;
    }

    .btn-wrap {
      margin-top: 22px;
    }

    .btn {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
      color: var(--gold-light);
      border: none;
      padding: 12px 32px;
      font-size: 14px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(120,20,0,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(120,20,0,0.45); }
    .btn:active { transform: translateY(0); }

    .counter {
      margin-top: 14px;
      font-size: 11px;
      color: #b89050;
      letter-spacing: 1.5px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }
    .star {
      font-size: 14px;
      animation: starPulse 1.8s ease-in-out infinite;
    }
    .star:nth-child(2) { animation-delay: 0.3s; }
    .star:nth-child(3) { animation-delay: 0.6s; }
    @keyframes starPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
</head>
<body>

  <!-- Lanterns -->
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>

  <!-- Falling petals (generated by JS) -->

  <div class="card-wrap">
    <div class="card">
      <div class="corner-tl"></div>
      <div class="corner-br"></div>

      <div class="title-row">
        <span class="title-line"></span>
        <span class="title">May Mắn</span>
        <span class="title-line"></span>
      </div>

      <span class="symbol" id="symbol">🌸</span>
      <h1 class="heading">Lời Chúc Hôm Nay</h1>
      <div class="divider"></div>

      <p class="fortune-text" id="fortune">Đang chọn lời chúc cho bạn...</p>

      <p class="sub-text">福 · 祿 · 壽 · 喜</p>

      <div class="btn-wrap">
        <button class="btn" onclick="newFortune()">✦ Rút lại ✦</button>
      </div>

      <p class="counter" id="counter"></p>

      <div class="stars">
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
      </div>
    </div>
  </div>

  <script>
    const fortunes = [
      { text: "Có công mài sắt, có ngày mỏi tay.", symbol: "🌸" },
      { text: "Uống nước nhớ nguồn, còn m thì có nhớ nyc ko?.", symbol: "🌺" },
      { text: "Công thành danh toại, tao cong kệ tao.", symbol: "⭐" },
      { text: "Có chí thì nên, còn không thì thôi.", symbol: "🏮" },
      { text: "Tâm an thì mọi sự an — hãy giữ vững niềm tin, điều tốt đẹp luôn đến với bạn.", symbol: "🌟" },
      { text: "Duyên may đang gõ cửa, hãy rộng tay đón nhận những cơ hội tuyệt vời phía trước.", symbol: "🍀" },
      { text: "Tri thức là kho báu vô tận — mỗi ngày học một điều mới là bạn đang tiến gần thành công.", symbol: "📖" },
      { text: "Nụ cười của bạn là phép màu — lan tỏa yêu thương và hạnh phúc sẽ nhân lên gấp bội.", symbol: "😊" },
      { text: "Bình an trong tâm hồn là giàu có nhất — bạn đang sở hữu điều quý giá hơn vàng bạc.", symbol: "🕊️" },
      { text: "Những hạt giống tốt đẹp bạn gieo hôm nay sẽ nở thành những bông hoa rực rỡ mai sau.", symbol: "🌻" },
      { text: "Trái tim chân thành, bàn tay siêng năng — cuộc đời sẽ ban tặng cho bạn trọn vẹn những gì xứng đáng.", symbol: "💛" },
      { text: "Hành trình nghìn dặm bắt đầu từ một bước chân — hãy dũng cảm bước đi, vũ trụ sẽ ủng hộ bạn.", symbol: "🌙" },
      { text: "Niềm vui nhỏ mỗi ngày cộng lại thành hạnh phúc lớn — hãy trân trọng từng khoảnh khắc hiện tại.", symbol: "✨" },
      { text: "Bạn là ánh sáng trong cuộc đời của nhiều người — hãy tiếp tục tỏa sáng và truyền cảm hứng.", symbol: "💫" },
      { text: "Vận may đang đứng sau vai bạn, chỉ cần tin tưởng vào bản thân — thành công sẽ đến rất gần.", symbol: "🌈" },
      { text: "Gia đình là bến bờ bình an — dù sóng gió thế nào, bạn luôn có nơi để trở về.", symbol: "🏡" },
      { text: "Sức mạnh thật sự đến từ bên trong — bạn có đủ nghị lực để vượt qua mọi thử thách.", symbol: "🔥" },
      { text: "Mỗi buổi sáng là một tờ giấy trắng mới — hãy viết lên đó những điều tươi đẹp nhất.", symbol: "🌅" },
    ];

    let count = 0;
    let lastIndex = -1;

    function newFortune() {
      const el = document.getElementById('fortune');
      const sym = document.getElementById('symbol');
      el.classList.add('fade');
      setTimeout(() => {
        let idx;
        do { idx = Math.floor(Math.random() * fortunes.length); } while (idx === lastIndex);
        lastIndex = idx;
        count++;
        el.textContent = fortunes[idx].text;
        sym.textContent = fortunes[idx].symbol;
        el.classList.remove('fade');
        document.getElementById('counter').textContent = `Đã rút ${count} lần`;
        spawnPetals();
      }, 320);
    }

    function spawnPetals() {
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = '-20px';
        p.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        p.style.animationDelay = (Math.random() * 0.8) + 's';
        p.style.transform = `rotate(${Math.random()*360}deg) scale(${0.6 + Math.random()*0.8})`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 6000);
      }
    }

    // Show first fortune on load
    window.addEventListener('load', () => {
      setTimeout(() => newFortune(), 400);
    });

    // Continuous background petals
    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (4 + Math.random() * 4) + 's';
      p.style.animationDelay = '0s';
      p.style.opacity = '0';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 10000);
    }, 1200);
  </script>
</body>
</html>
